<body><div class="w" id="root"></div>
<script>
const W=[[5,5,0,8],[5,6,0,9],[6,6,0,10],[5,5,0,8],[6,6,0,11],[6,7,0,12],[6,7,5,12],[5,6,5,10],[6,7,5,13],[7,8,5,14],[7,8,6,15],[6,7,5,11],[7,8,6,16],[8,9,6,17],[8,9,7,18],[6,8,5,13],[7,9,6,19],[8,9,6,21],[8,10,6,23],[6,8,5,16],[8,10,6,25],[9,10,7,27],[9,10,7,29],[7,8,5,18],[9,10,7,30],[8,8,6,24],[9,10,7,32],[8,8,5,22],[7,7,5,16],[6,6,5,10],[5,5,5,42.195]];
const START=new Date(2026,9,19),FIRST=4,dw=w=>w-FIRST+1,RACE=new Date(2027,4,23),DN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pi=w=>w<=8?1:w<=16?2:w<=27?3:w<=30?4:5, dl=w=>w%4==0&&w<=24, phase=w=>w<=8?"Base":w<=16?"Build I":w<=27?"Build II":w<=30?"Taper":"Race week";
const dt=(w,d)=>new Date(2026,9,19+(w-1)*7+d);
const fd=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const nowWeek=()=>{const n=new Date();n.setHours(0,0,0,0);return Math.min(31,Math.max(FIRST,Math.floor(Math.round((n-START)/864e5)/7)+1))};
let S={g:"4:15:00",l:{},t:0},cur=nowWeek(),view="prog",open=null,only=null,fx=0,popk=null,sync="Saved on this device";

function sess(w,d){
 const [a,b,c,e]=W[w-1],D=dl(w),R=w==31;
 const thu=w<=4?"Easy":(w<13||D||w>27)?"Easy + strides":(w<=19&&w%2)?"Intervals":"Tempo";
 const td={"Easy":"Easy, flat, RPE 3–4","Tempo":"10 min easy, 15–25 min at RPE 6 (comfortably hard), easy home","Intervals":`15 min easy, ${(IV[w]||[5,3])[0]} × ${(IV[w]||[5,3])[1]} min at 10k effort (RPE 7–8), 2 min easy jog between, 10 min easy`,"Easy + strides":"Easy, then 4 × 20 s relaxed strides (smooth, never a sprint)"};
 const mp=e>=23&&!D&&w<=27&&w!=26;
 if(d==0||d==2)return{t:"x",n:"Rest day",x:"Optional: log a strength session if you fancy one"};
 
 if(d==1)return{t:"r",km:a,n:R?"Easy":"Easy run",x:"Easy, flat, RPE 3–4"};
 if(d==3)return{t:"r",km:b,n:R?"Easy + strides":thu=="Intervals"?"Intervals · "+IV[w][0]+" × "+IV[w][1]+" min":thu+" run",x:R?td["Easy + strides"]:td[thu]};
 if(d==4)return{t:"x",n:"Rest or 30 min easy ride",x:"Optional, no running"};
 if(d==5)return c?{t:"r",km:c,n:R?"Shakeout":"Easy run",x:"Easy, flat, RPE 3–4"}:{t:"x",n:"Rest",x:"Full rest day"};
 return R?{t:"r",km:e,n:"RACE DAY 🏁",x:"Sanlam Cape Town Marathon · start steady, no heroics before 30 km",race:1}:{t:"r",km:e,n:mp?"Long run + marathon-effort finish":"Long run",x:mp?"Easy, then last 6–8 km at marathon effort (RPE 5–6)":e>=14?"Easy, RPE 2–3. Carry water and practise your race fuelling":"Easy, RPE 2–3. Relaxed and steady, carry water",long:1};
}
function exs(w,k){
 const A=[["Romanian deadlift","3×8"],[w>=9?"Bulgarian split squat":"Split squat","3×8"],["Sliding hamstring curl","3×10"],["Single-leg glute bridge","3×10/side"],["Side plank","2×30–45 s"]];
 const B=[["Single-leg RDL","3×8"],["Reverse lunge","3×8"],["Step-up","3×6"],["Single-leg calf raise","3×12–15"],["Pull-ups or lat pull","3×6–8"],["DB press","3×8"]];
 return(k=="A"?A:B).map(([n,s])=>[n,w>=31?"1 light set":w>=28?"2×"+s.split("×")[1]:s]);
}
const snote=w=>w<=4?"Rebuild: hold loads where they are and keep effort at RPE 7 or lower.":w<=12?"Progress: add about 2.5 kg to the RDL once 3×8 feels 7/10 or easier and you recover well by the next morning.":w<=27?"Maintain: heavy-ish, leave 2 reps in reserve. Keep Strength B moderate, since it sits the day before Thursday’s run.":w<=30?"Taper: 2 sets each, light, nothing to failure.":"Race week: one light set each, then rest.";
const secs=t=>{if(!t)return 0;const p=String(t).split(":").map(Number);if(p.some(isNaN))return 0;return p.length==3?p[0]*3600+p[1]*60+p[2]:p.length==2?p[0]*60+p[1]:p[0]*60};

const slots=w=>(S.mv&&S.mv[w])||[0,1,2,3,4,5,6],lg=k=>k[0]=="x"?((S.x=S.x||{})[k]||(S.x[k]={})):(S.l[k]||(S.l[k]={}));
const wk=w=>{let p=0,l=0,h=0;for(let d=0;d<7;d++){const s=sess(w,d),e=S.l[w+"-"+d]||{};if(s.t=="r"){p+=s.km;if(e.done)l+=+e.km||s.km}}for(const k in S.x){const e=S.x[k];if(e.type=="run"&&+e.km&&e.date&&xw(e.date)==w)l+=+e.km}return{p,l,h}};

let ref=null,tm;
function save(){S.t=Date.now();try{localStorage.setItem("ct27",JSON.stringify(S))}catch(e){}clearTimeout(tm);tm=setTimeout(async()=>{if(ref){try{await ref.set({s:JSON.stringify(S)});sync="Synced to your account";}catch(e){sync="Saved on this device"}const el=$("#sync");if(el)el.textContent=sync}},700)}
async function init(){
 try{const l=JSON.parse(localStorage.getItem("ct27"));if(l&&l.l)S=l}catch(e){}

 try{if(!window.claude)return;const[u,db]=await Promise.all([claude.use("user"),claude.use("db")]);
  if(!u||!db)return;const id=await u.id();if(!id)return;
  ref=db.collection("data/users/"+id).doc("log");const sn=await ref.get();
  if(sn.exists){const r=JSON.parse(sn.data().s);if((r.t||0)>(S.t||0)){S=r}else if((S.t||0)>(r.t||0))ref.set({s:JSON.stringify(S)});sync="Synced to your account"}
  else if(S.t){await ref.set({s:JSON.stringify(S)});sync="Synced to your account"}
  render()}catch(e){}
}

function hdr(){const w=wk(cur),pc=Math.min(100,w.p?w.l/w.p*100:0);return`<div class="card" style="background:linear-gradient(135deg,var(--p${pi(cur)}t),var(--card) 70%)"><div class="nav"><button data-a="prev">‹</button><div style="text-align:center"><h2>Week ${dw(cur)} · ${fd(dt(cur,0))} – ${fd(dt(cur,6))}</h2><span class="pill ph${pi(cur)}">${phase(cur)}</span>${dl(cur)?'<span class="pill d">Deload</span>':""}${cur==nowWeek()?'<span class="pill">This week</span>':""}${w.p&&w.l>=w.p?'<span class="pill ph3">🎉 Week complete</span>':""}</div><button data-a="next">›</button></div><div class="bar"><i style="width:${pc}%;background:var(--p${pi(cur)})"></i></div><div class="sub"><b>${w.l.toFixed(1)}</b> of ${w.p.toFixed(w.p%1?1:0)} km run</div></div>`}
function plan(){
 let h=only==null?hdr():"";

 g+=`<text x="686" y="12" text-anchor="end">${f(inv?lo:hi)}</text><text x="686" y="124" text-anchor="end">${f(inv?hi:lo)}</text><polygon points="${X(pts[0].x)},112 ${pts.map(p=>X(p.x)+","+Y(p.v)).join(" ")} ${X(pts[pts.length-1].x)},112" fill="var(${c})" opacity=".13"/><polyline points="${pts.map(p=>X(p.x)+","+Y(p.v)).join(" ")}" fill="none" stroke="var(${c})" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`+pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.v)}" r="3.5" fill="var(${c})"/>`).join("");
 return h+`<svg viewBox="0 0 690 150" width="100%">${g}</svg><div class="note">First ${f(pts[0].v)} → latest ${f(pts[pts.length-1].v)} · x-axis is training week</div></div>`}
function trends(){
 const P={e:[],h:[],l:[],r:[]};
 for(const k in S.l){const e=S.l[k];if(!e.done)continue;const[w,q]=k.split("-").map(Number);if(!W[w-1])continue;const s=sess(w,q),x=w+Math.max(0,slots(w).indexOf(q))/7;
  if(s.t=="r"&&!s.race){const km=+e.km||s.km;
   if(s.long)P.l.push({x,v:km});
   else if(!/Tempo|Interval/.test(s.n)){const sc=secs(e.t);if(sc&&km>=1)P.e.push({x,v:sc/km});if(+e.hr)P.h.push({x,v:+e.hr})}}
  }
 for(const k in S.x){const e=S.x[k];if(e.type=="strength"&&(e.k||"A")=="A"&&+e.w0&&e.date)P.r.push({x:Math.max(FIRST,xw(e.date))+((pd(e.date).getDay()+6)%7)/7,v:+e.w0})}
 const mp=v=>{const r=Math.round(v);return Math.floor(r/60)+":"+String(r%60).padStart(2,"0")+"/km"};
 return`<h2 style="margin:18px 0 0">Trends</h2>`+trend("Easy-run pace (faster is higher)",P.e,mp,"--p1",1)+trend("Easy-run average heart rate",P.h,v=>Math.round(v)+" bpm","--p5")+trend("Long-run distance",P.l,v=>v.toFixed(1)+" km","--p3")+trend("Romanian deadlift weight",P.r,v=>v+" kg","--p2")}
function applyPrefs(){const r=document.documentElement;if(!r||!r.style)return;if(S.th)r.dataset.theme=S.th;else delete r.dataset.theme;r.style.zoom=[1,1.12,1.25][S.fs||0]}
function thisWeek(){const T=t0(),off=Math.round((T-START)/864e5),w=Math.min(31,Math.max(FIRST,Math.floor(off/7)+1)),x=wk(w),sl=slots(w);let tot=0,dn=0,nx=null;
 for(let d=0;d<7;d++){const q=sl[d],s=sess(w,q),e=S.l[w+"-"+q]||{};if(s.t=="x")continue;tot++;if(e.done)dn++;else if(!e.skip&&!nx&&(off<0||dt(w,d)>=T))nx={d,s}}
 return`<div class="card" style="background:linear-gradient(135deg,var(--p${pi(w)}t),var(--card) 70%)"><h2>This week · Week ${dw(w)}</h2><div class="bar"><i style="width:${Math.min(100,x.p?x.l/x.p*100:0)}%;background:var(--p${pi(w)})"></i></div><div class="sub"><b>${x.l.toFixed(1)}</b> of ${x.p.toFixed(x.p%1?1:0)} km · <b>${dn}</b> of ${tot} sessions done</div><div style="margin-top:8px">${nx?`<span class="pill ph${pi(w)}">Next</span> ${DN[nx.d]} · <b>${esc(nx.s.n)}</b>${nx.s.t=="r"?" · "+(nx.s.km%1?nx.s.km.toFixed(1):nx.s.km)+" km":""}`:"All done for this week 🎉"}</div></div>`}
function miles(){let runs=0,km=0,lo=0,mw=0,wc=0;
 for(const k in S.l){const e=S.l[k];if(!e.done)continue;const[w,q]=k.split("-").map(Number);if(!W[w-1])continue;const s=sess(w,q);if(s.t=="r"){const v=+e.km||s.km;runs++;km+=v;lo=Math.max(lo,v)}}
 for(const k in S.x){const e=S.x[k];if(e.type=="run"&&+e.km){runs++;km+=+e.km;lo=Math.max(lo,+e.km)}}
 for(let w=1;w<=30;w++){const x=wk(w);mw=Math.max(mw,x.l);if(x.p&&x.l>=x.p)wc++}
 const B=[["🏃","First run",runs>=1],["🔟","10 runs",runs>=10],["💯","100 km total",km>=100],["🏅","250 km total",km>=250],["🌟","500 km total",km>=500],["⛰️","20 km long run",lo>=20],["🚀","30 km long run",lo>=30],["📈","40 km week",mw>=40],["🔥","50 km week",mw>=50],["✅","First full week",wc>=1]];
 return`<div class="card"><h2>Milestones · ${B.filter(b=>b[2]).length} of ${B.length}</h2><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">${B.map(([i,n,ok])=>`<span style="padding:6px 12px;border-radius:99px;font-size:14px;font-weight:600;background:${ok?"var(--p2t)":"var(--bg)"};color:${ok?"var(--p2)":"var(--mut)"};opacity:${ok?1:.55}">${i} ${n}</span>`).join("")}</div>${lo?`<p class="note" style="margin:10px 0 0">Longest run so far: <b>${lo.toFixed(1)} km</b></p>`:""}</div>`}
const IV={13:[5,3],15:[6,3],17:[5,4],19:[6,4]};
const ZN={e:[40,85],l:[30,75],t:[-25,-15],i:[-45,-35],m:[-3,3]};
const fp=v=>{const r=Math.round(v);return Math.floor(r/60)+":"+String(r%60).padStart(2,"0")};
const zone=s=>s.race?"m":s.long?"l":/Tempo/.test(s.n)?"t":/Interval/.test(s.n)?"i":"e";
const predM=()=>{const r=S.rr||{},d=+r.km,t=secs(r.t);return d>0&&t>0?t*Math.pow(42.195/d,1.06):0};
const MPs=()=>{const p=predM();if(p&&S.pb!="goal")return p/42.195;const g=secs(S.g);return g?g/42.195:0};
const rng=z=>{const m=MPs();return m?[m+ZN[z][0],m+ZN[z][1]]:null};
const tgt=s=>{const z=zone(s),r=rng(z);if(!r)return"";return z=="m"?" · Goal pace "+fp(MPs())+"/km":" · Target "+fp(r[0])+"–"+fp(r[1])+"/km"+(/marathon/.test(s.n)?", finish at "+fp(MPs())+"/km":"")};
function easyCheck(){const L=[];
 for(const k in S.l){const e=S.l[k];if(!e.done)continue;const[w,q]=k.split("-").map(Number);if(!W[w-1]||w<FIRST)continue;const s=sess(w,q);if(s.t!="r"||zone(s)!="e")continue;const km=+e.km||s.km,sc=secs(e.t);L.push({x:w+slots(w).indexOf(q)/7,v:sc&&km?sc/km:0,h:+e.hr||0})}
 L.sort((a,b)=>a.x-b.x);const P=L.filter(y=>y.v),H=L.filter(y=>y.h),r=rng("e"),av=a=>a.reduce((x,y)=>x+y,0)/a.length;
 let h=`<div class="card"><h2>Easy-run check</h2>`;
 if(P.length<3||!r)return h+`<p class="note">Log at least three easy runs with times and I’ll check you’re keeping them easy.</p></div>`;
 const rec=P.slice(-5).map(y=>y.v),a=av(rec);
 h+=`<div class="sub"><b>${fp(a)}/km</b> average over your last ${rec.length} easy runs · target ${fp(r[0])}–${fp(r[1])}/km</div><p style="margin:8px 0 0">${a<r[0]-5?`<span class="pill ph5">Too fast</span> You’re ${Math.round(r[0]-a)} s/km quicker than the easy range. Slow down: easy days are what let you hit the hard days properly.`:a>r[1]+10?`<span class="pill ph2">Slower</span> Running slower than the range is fine while you’re rebuilding, or it’s hot or you’re tired.`:`<span class="pill ph3">On target</span> Your easy runs are sitting where they should.`}</p>`;
 if(H.length>=4){const ea=av(H.slice(0,2).map(y=>y.h)),la=av(H.slice(-2).map(y=>y.h)),d=la-ea;h+=`<p class="note" style="margin:8px 0 0">Easy-run heart rate: ${Math.round(ea)} bpm early, ${Math.round(la)} bpm lately. ${d>=5?"That’s creeping up. If your pace isn’t faster, you may be tired or run down: consider an easier week.":d<=-3?"Heart rate is dropping at easy effort: fitness is building.":"Steady."}</p>`}
 return h+"</div>"}
function paceCard(){const m=MPs(),rr=S.rr||{},pm=predM(),hm=v=>{const r=Math.round(v);return Math.floor(r/3600)+":"+String(Math.floor(r%3600/60)).padStart(2,"0")+":"+String(r%60).padStart(2,"0")},ur=pm&&S.pb!="goal";
 const Z=[["e","Easy runs","RPE 3–4"],["l","Long runs","RPE 2–3"],["t","Tempo","RPE 6"],["i","Interval reps","RPE 7–8"],["m","Marathon pace","race day"]];
 return`<div class="card"><h2>Pace targets</h2><p class="note">${m?`Based on ${ur?"your recent race":"your goal time"} · marathon pace ${fp(m)}/km`:"Enter a goal time above to get pace targets."}</p>${m?Z.map(([z,n,d])=>{const r=rng(z);return`<div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)"><span><b>${n}</b> <span class="note">${d}</span></span><b>${fp(r[0])}–${fp(r[1])}/km</b></div>`}).join(""):""}<div class="g" style="margin-top:12px;flex-wrap:wrap">Recent race <input id="rrk" type="number" inputmode="decimal" placeholder="km" value="${esc(rr.km)}" style="width:70px"> km in <input id="rrt" placeholder="h:mm:ss" value="${esc(rr.t)}"></div>${pm?`<p class="note" style="margin:10px 0 0">That predicts a marathon of about <b>${hm(pm)}</b>. Predictions from shorter races run optimistic, so treat it as a ceiling.</p><button class="rb" data-a="pb" style="padding:6px 14px;margin-top:8px">${ur?"Use my goal time instead":"Use this race for pace targets"}</button>`:""}</div>`}
function hero(){const n=t0(),off=Math.round((n-START)/864e5),pre=off<0,d2=pre?-off:Math.max(0,216-off),pc=Math.min(100,Math.max(0,(off-(FIRST-1)*7)/(216-(FIRST-1)*7)*100)),PH2=[[5,1,"Base"],[8,2,"Build I"],[11,3,"Build II"],[3,4,"Taper"],[1,5,"🏁"]];
 return`<div class="hero"><div class="hbtns"><button data-a="fs" aria-label="Text size">Aa</button><button data-a="theme" aria-label="Colour mode">${S.th=="light"?"☀️ Light":S.th=="dark"?"🌙 Dark":"🌗 Auto"}</button></div><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px"><div><div class="eyebrow">Cape Town Marathon · Sun 23 May 2027</div><h1>Training log</h1></div><div style="text-align:right"><div class="big">${d2}</div><div class="eyebrow">${pre?"days to start":"days to go"}</div></div></div><div class="tl">${PH2.map(([w,p])=>`<i style="flex:${w};background:var(--p${p})"></i>`).join("")}<b class="mk" style="left:${pc}%"></b></div><div class="tll">${PH2.map(([w,p,n])=>`<span><i style="background:var(--p${p})"></i>${n=="🏁"?"Race":n}</span>`).join("")}</div><div class="eyebrow" style="margin-top:8px;text-transform:none;letter-spacing:0" id="sync">${sync}</div></div>`}
function progPage(){const o=prog(),i=o.indexOf('<div class="card"><h2>Weekly km'),j=o.indexOf('<div class="card g">');return o.slice(i,j)+thisWeek()+easyCheck()+o.slice(0,i)+miles()+o.slice(j)+paceCard()+trends()+expo()}
function render(){
 applyPrefs();$("#root").innerHTML=`${hero()}<div class="tabs">${[["prog","📈","Progress"],["today","📍","Today"],["plan","📋","Plan"],["cal","🗓️","Calendar"]].map(([v,i,n])=>`<button data-a="tab" data-v="${v}" class="${view==v?"on":""}"><span>${i}</span>${n}</button>`).join("")}</div>${view=="plan"?plan():view=="today"?todayView():view=="cal"?calView():progPage()}`;popk=null;if(fx){const r=$("#root");if(r.classList){r.classList.remove("fx");void r.offsetWidth;r.classList.add("fx")}fx=0}}
document.addEventListener("click",ev=>{
 const t=ev.target.closest("[data-a]");if(!t||(ev.target.closest(".form")&&t.dataset.a!="xdel"))return;const a=t.dataset.a,k=t.dataset.k;
 if(a=="prev"&&cur>FIRST)cur--;else if(a=="next"&&cur<31)cur++;else if(a=="tab"){view=t.dataset.v;fx=1}else if(a=="goto"){cur=+t.dataset.w;view="plan"}
 else if(a=="done"){const e=lg(k);e.done=!e.done;if(e.done)e.skip="";popk=e.done?k:null;save()}
 else if(a=="open"){open=open==k?null:k}else if(a=="mv"){const p=slots(cur).slice(),d=+t.dataset.d,j=d+ +t.dataset.dir;if(j<0||j>6)return;[p[d],p[j]]=[p[j],p[d]];(S.mv=S.mv||{})[cur]=p;save()}else if(a=="rst"){if(S.mv)delete S.mv[cur];save()}else if(a=="csv"){exportCsv();return}else if(a=="xadd"){const id="x"+Date.now();(S.x=S.x||{})[id]={date:t.dataset.date||$("#xd").value,type:t.dataset.type,k:"A",name:"",km:"",t:"",hr:"",rpe:"",note:""};open=id;save()}else if(a=="xdel"){if(S.x)delete S.x[k];if(open==k)open=null;save()}else if(a=="cal"){cur=+t.dataset.w;view="plan";open=t.dataset.k}else if(a=="theme"){S.th=!S.th?"light":S.th=="light"?"dark":"";save()}else if(a=="fs"){S.fs=((S.fs||0)+1)%3;save()}else if(a=="print"){try{window.print()}catch(e){}return}else if(a=="pb"){S.pb=S.pb=="goal"?"race":"goal";save()}else return;
 if(a=="prev"||a=="next")open=null;ev.stopPropagation();render()});
document.addEventListener("input",ev=>{
 const i=ev.target;if(i.id=="wsum"){(S.wn=S.wn||{})[cur]=i.value;save();return}if(i.id=="goal"){S.g=i.value;save();return}if(i.id=="rrk"||i.id=="rrt"){S.rr=S.rr||{};S.rr[i.id=="rrk"?"km":"t"]=i.value;save();return}
 if(!i.dataset.f)return;const k=i.dataset.k,e=lg(k);e[i.dataset.f]=i.value;
 if(k[0]!="x"&&(i.dataset.f=="km"||i.dataset.f=="t"||i.dataset.f=="ham"||i.dataset.f=="hr")){const[w,d]=k.split("-").map(Number),m=$("#m"+k);if(m)m.innerHTML=msg(e,sess(w,d))}
 save()});
document.addEventListener("change",ev=>{const i=ev.target,f=i.dataset&&i.dataset.f;if(i.id=="goal"||i.id=="rrk"||i.id=="rrt"){render();return}if(!f)return;if(f=="skip"){if(i.value)lg(i.dataset.k).done=false;save();render()}else if(f=="type"||f=="k")render();else if(f=="km"&&i.dataset.k[0]!="x"){const t=$(".card .bar");if(t){const c=t.closest(".card");c.outerHTML=hdr()}}});
init();
